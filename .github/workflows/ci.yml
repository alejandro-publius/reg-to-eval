name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        # ruff is pinned: an unpinned linter turns every upstream release into
        # a red build on untouched code. Bump it deliberately, with the fixes.
        run: pip install -e . pytest 'ruff==0.16.6'
      - name: Lint
        run: ruff check src/ tests/
      - name: Test
        # Includes the slow-marked integration tests: they run the real
        # Inspect loop against a mock model (~4s) and are the only tests that
        # exercise the judge plumbing end to end.
        run: pytest tests/ -q
