[project]
name = "reg-to-eval"
version = "0.0.1"
description = "Skeleton: translating one EU AI Act transparency obligation into an Inspect eval"
requires-python = ">=3.10"
dependencies = ["inspect-ai>=0.3"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
