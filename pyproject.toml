[project]
name = "reg-to-eval"
version = "0.0.1"
description = "Skeleton: translating one EU AI Act transparency obligation into an Inspect eval"
requires-python = ">=3.10"
dependencies = ["inspect-ai>=0.3"]

[project.optional-dependencies]
# Pin ruff to the same version CI runs (see .github/workflows/ci.yml) so a
# local `ruff check` and the CI job agree.
dev = ["pytest", "ruff==0.16.6"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "FURB"]
